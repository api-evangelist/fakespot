name: Fakespot
description: Fakespot was an AI-powered fake-review detection service, founded in 2016, that graded the
  trustworthiness of product reviews on Amazon and other online marketplaces through a browser extension,
  mobile apps, and website. Mozilla acquired Fakespot in 2023 and integrated its technology into Firefox
  as the Review Checker. Mozilla discontinued the product in 2025 — the Firefox Review Checker on June 10,
  2025 and the Fakespot browser extension, mobile apps, and website on July 1, 2025 — and fakespot.com now
  redirects to a Mozilla announcement. No public API, developer portal, or machine-readable discovery
  surface exists; this profile is retained as a historical/defunct record.
